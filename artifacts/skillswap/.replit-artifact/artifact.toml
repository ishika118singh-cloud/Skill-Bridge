kind = "web"
previewPath = "/"
title = "Skill Bridge"
description = "Skill Bridge is a responsive skill-sharing marketplace for discovering mentors, exchanging skills, managing portfolios, and coordinating learning sessions. Uses browser localStorage for a clearly labeled single-device demo."
version = "1.0.0"
id = "artifacts/skillswap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21899

[services.development]
run = "pnpm --filter @workspace/skillswap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/skillswap", "run", "build" ]
serve = "static"
publicDir = "artifacts/skillswap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21899"
BASE_PATH = "/"
